name: Android implementation
description: Scoped Android UI, Layer 1, Media3, device, or Play work
title: ""
labels: ["type:implementation"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable Android behavior should exist?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Repository boundary
      description: State what Android owns and what remains in cloud or desktop.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Device verification
      description: API levels, codecs, orientations, resolutions, and fallback cases.
