services:
  - type: web
    name: ctrlb-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: MOONSHOT_MODEL
        value: kimi-k3
      - key: CTRLB_DESKTOP_AI_PROVIDER
        value: kimi
      - key: CTRLB_PLANNER_CLIENT_TOKEN
        sync: false
      - key: CTRLB_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CTRLB_AUTH_AUDIENCE
        sync: false
      - key: CTRLB_AUTH_AUTHORIZED_PARTIES
        sync: false
      - key: CTRLB_AUTH_DEFAULT_SCOPES
        value: plan:create transcribe:create derivatives:create
      - key: SUPABASE_DB_URL
        sync: false
      - key: CTRLB_PADDLE_WEBHOOK_SECRET
        sync: false
      - key: CTRLB_PADDLE_API_KEY
        sync: false
      - key: CTRLB_PADDLE_BASIC_PRICE_ID
        value: pri_01ky702b613pksvmp89n0tmtqq
      - key: CTRLB_PADDLE_PRO_PRICE_ID
        value: pri_01ky700cx5s50k34sg76bbgz6d
      - key: CTRLB_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CTRLB_AUDIO_CATALOG_URL
        sync: false
      - key: FREESOUND_API_KEY
        sync: false
