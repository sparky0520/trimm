services:
  - type: web
    name: trimm-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: MOONSHOT_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: MOONSHOT_MODEL
        value: kimi-k3
      - key: TRIMM_DESKTOP_AI_PROVIDER
        value: kimi
      - key: TRIMM_PLANNER_CLIENT_TOKEN
        sync: false
      - key: TRIMM_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: TRIMM_AUTH_AUDIENCE
        sync: false
      - key: TRIMM_AUTH_AUTHORIZED_PARTIES
        sync: false
      - key: TRIMM_AUTH_DEFAULT_SCOPES
        value: plan:create transcribe:create derivatives:create
      - key: SUPABASE_DB_URL
        sync: false
