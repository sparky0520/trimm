services:
  - type: web
    name: trimm-backend
    runtime: docker
    dockerfilePath: ./services/backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_OPENAI_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: MODEL
        value: kimi-k3
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: ELEVENLABS_API_TOKEN
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: SFX_S3_BUCKET
        sync: false
