# fly.toml app configuration file generated for trimm on 2026-09-06T07:47:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trimm'
primary_region = 'sin'

# NOTE: Fly does not support specifying machine count directly in fly.toml.
# We have scaled this to 1 machine via `fly scale count 1`.
# The CI/CD deployment script uses `--ha=false` to prevent Fly from auto-provisioning a 2nd machine.

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
