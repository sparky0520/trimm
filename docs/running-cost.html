<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trimm Cost Visualizer</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 system-ui, sans-serif; }
    body { margin: 0; background: #09090B; color: #FAFAFA; }
    main { max-width: 760px; margin: 0 auto; padding: 64px 24px 96px; }
    h1, h2, h3 { line-height: 1.2; font-family: system-ui, sans-serif; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin-bottom: .25rem; font-weight: 600; letter-spacing: -1px; }
    h2 { margin-top: 2.25rem; font-size: 20px; font-weight: bold; }
    .muted { color: #A1A1AA; font-size: 14px; }
    a { color: #FAFAFA; text-decoration: underline; }
    
    .card { background: #18181B; padding: 32px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #3F3F46; }
    .slider-container { margin: 32px 0; }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #FAFAFA; height: 6px; }
    .cost-value { font-size: 3rem; font-weight: 800; color: #FAFAFA; letter-spacing: -1px; margin-top: 8px; }
    
    .chart-container { position: relative; height: 300px; width: 100%; margin-top: 16px; }
    
    ul { font-size: 14px; }
    ul li { margin-bottom: 12px; color: #D4D4D8; }
    strong { color: #FAFAFA; }
  </style>
  <script src="./chart.js"></script>
</head>
<body>
  <main>
    <h1>Infrastructure Costs</h1>
    <p class="muted">Interactive cost visualizer for the trimm backend.</p>

    <div class="card">
      <h2 style="margin-top: 0;">Monthly Active Users (MAU)</h2>
      <div class="slider-container">
        <input type="range" id="mau-slider" min="0" max="100000" step="1000" value="1000">
        <p style="font-size: 1.25rem;">Estimated Users: <span id="mau-display" style="font-weight: bold; color: #fff;">1,000</span></p>
      </div>
      
      <div style="margin-top: 48px;">
        <h2 style="margin: 0; color: #a9a9b2; font-size: 1.1rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;">Estimated Monthly Cost</h2>
        <div class="cost-value">$<span id="total-cost">0.00</span></div>
      </div>
    </div>

    <h2>Breakdown (Graph)</h2>
    <div class="card" style="padding: 16px 32px;">
      <div class="chart-container">
        <canvas id="costChart"></canvas>
      </div>
      <div class="chart-container" style="margin-top: 32px;">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

  </main>
  <script>
    const slider = document.getElementById('mau-slider');
    const mauDisplay = document.getElementById('mau-display');
    const totalCostDisplay = document.getElementById('total-cost');
    const ctx = document.getElementById('costChart').getContext('2d');

    let costChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Fly.io', 'Supabase', 'Moonshot AI', 'AssemblyAI', 'Audio'],
        datasets: [{
          label: 'Estimated Cost ($)',
          data: [0, 0, 0, 0, 0],
          backgroundColor: [
            'rgba(255, 99, 132, 0.8)',
            'rgba(54, 162, 235, 0.8)',
            'rgba(255, 206, 86, 0.8)',
            'rgba(75, 192, 192, 0.8)',
            'rgba(153, 102, 255, 0.8)'
          ],
          borderColor: [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 206, 86, 1)',
            'rgba(75, 192, 192, 1)',
            'rgba(153, 102, 255, 1)'
          ],
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(255, 255, 255, 0.1)' },
            ticks: { color: '#FAFAFA' }
          },
          x: {
            grid: { display: false },
            ticks: { color: '#FAFAFA' }
          }
        }
      }
    });

    const pieCtx = document.getElementById('pieChart').getContext('2d');
    let pieChart = new Chart(pieCtx, {
      type: 'pie',
      data: {
        labels: ['Fly.io', 'Supabase', 'Moonshot AI', 'AssemblyAI', 'Audio'],
        datasets: [{
          data: [0, 0, 0, 0, 0],
          backgroundColor: [
            'rgba(255, 99, 132, 0.8)',
            'rgba(54, 162, 235, 0.8)',
            'rgba(255, 206, 86, 0.8)',
            'rgba(75, 192, 192, 0.8)',
            'rgba(153, 102, 255, 0.8)'
          ],
          borderColor: [
            'rgba(255, 99, 132, 1)',
            'rgba(54, 162, 235, 1)',
            'rgba(255, 206, 86, 1)',
            'rgba(75, 192, 192, 1)',
            'rgba(153, 102, 255, 1)'
          ],
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'right', labels: { color: '#FAFAFA' } }
        }
      }
    });

    function updateCosts() {
      const mau = parseInt(slider.value, 10);
      mauDisplay.textContent = mau.toLocaleString();

      const flyCost = mau > 0 ? 2.00 : 0.00;
      const supabaseCost = mau > 50000 ? 25.00 : 0.00;
      const llmCost = mau * 0.05;
      const transcribeCost = mau * 0.10;
      const audioCost = mau * 0.05;

      const total = flyCost + supabaseCost + llmCost + transcribeCost + audioCost;
      totalCostDisplay.textContent = total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      // Update Chart data
      costChart.data.datasets[0].data = [flyCost, supabaseCost, llmCost, transcribeCost, audioCost];
      costChart.update();
      
      pieChart.data.datasets[0].data = [flyCost, supabaseCost, llmCost, transcribeCost, audioCost];
      pieChart.update();
    }

    slider.addEventListener('input', updateCosts);
    updateCosts();
  </script>
</body>
</html>
