name: Trimm
options: {}
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  Trimm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Trimm]
    info:
      path: Trimm/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    entitlements:
      path: Trimm/Trimm.entitlements
      properties:
        com.apple.developer.applesignin: ["Default"]
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: ai.ctrlb.mobile
    dependencies:
      - package: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
