name: Trimm
options:
  bundleIdPrefix: ai.ctrlb.mobile
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    branch: main
targets:
  Trimm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Trimm]
    info:
      path: Trimm/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSSpeechRecognitionUsageDescription: "Trimm uses speech recognition to transcribe your video clips for AI editing."
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
